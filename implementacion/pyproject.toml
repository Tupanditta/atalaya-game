[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atalaya"
version = "0.1.0"
description = "Prototipo del juego de defensa de la estación Atalaya"
requires-python = ">=3.11,<3.12"
dependencies = ["panda3d", "platformdirs"]

[project.scripts]
atalaya = "atalaya.arranque:main"

[tool.setuptools.packages.find]
include = ["atalaya*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
testpaths = ["pruebas"]
markers = ["lenta: simulación de partidas largas; se ejecuta al cerrar el sprint"]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]
# Signos de multiplicar y restar de las fórmulas de `reglasNegocio.md`.
allowed-confusables = ["×", "−"]

[tool.mypy]
python_version = "3.11"
strict = true
