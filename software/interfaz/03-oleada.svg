<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Atalaya · HUD durante una oleada</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#0D1A35"/><stop offset="1" stop-color="#02040A"/></radialGradient>
    <filter id="nebula" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF4D5E" stop-opacity="0"/><stop offset="1" stop-color="#FF4D5E" stop-opacity=".8"/></linearGradient>
  </defs>
  <style>
    .f{font-family:Rajdhani,'Segoe UI',sans-serif}
    .i{font-family:Inter,'Segoe UI',sans-serif}
    .p{fill:#0A1220;fill-opacity:.78;stroke:#2AD4FF;stroke-opacity:.35}
    .tx{fill:#E6F1FF}.ts{fill:#8AA0B8}.ta{fill:#2AD4FF}
    .lbl{font-size:16px;letter-spacing:3px;font-weight:600}
  </style>

  <!-- Escena -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="1300" cy="280" rx="460" ry="240" fill="#6B3FD6" opacity=".22" filter="url(#nebula)"/>
  <ellipse cx="520" cy="700" rx="380" ry="220" fill="#2AD4FF" opacity=".10" filter="url(#nebula)"/>
  <g fill="#E6F1FF">
    <circle cx="120" cy="90" r="1.2"/><circle cx="340" cy="210" r="0.9"/><circle cx="610" cy="120" r="1.5"/><circle cx="880" cy="60" r="1"/>
    <circle cx="1040" cy="240" r="1.3"/><circle cx="1260" cy="110" r="0.8"/><circle cx="1500" cy="70" r="1.4"/><circle cx="1780" cy="180" r="1"/>
    <circle cx="1860" cy="420" r="1.2"/><circle cx="1180" cy="760" r="0.9"/><circle cx="980" cy="640" r="1.1"/><circle cx="760" cy="880" r="1.4"/>
    <circle cx="640" cy="560" r="1"/><circle cx="1420" cy="600" r="1.3"/><circle cx="1650" cy="820" r="0.9"/><circle cx="1350" cy="980" r="1.2"/>
  </g>
  <!-- Enemigo sin efecto especial, mediano -->
  <g transform="translate(1190 430)" filter="url(#glow)">
    <polygon points="0,-16 22,0 0,16 -22,0" fill="#1B2233" stroke="#FF4D5E" stroke-width="2"/>
    <circle r="4" fill="#FF4D5E"/>
  </g>
  <!-- Desestabilizador, pequeño -->
  <g transform="translate(700 360)" filter="url(#glow)">
    <polygon points="0,-10 10,8 -10,8" fill="#1B2233" stroke="#FFD23F" stroke-width="2"/>
    <circle r="2.5" fill="#FFD23F"/>
  </g>
  <!-- Proyectil enemigo con estela -->
  <rect x="1060" y="468" width="90" height="3" fill="url(#trail)" transform="rotate(-160 1105 470)"/>
  <circle cx="1062" cy="486" r="6" fill="#FF4D5E" filter="url(#glow)"/>

  <!-- Mira normal (radio 40 px) -->
  <g stroke="#E6F1FF" stroke-width="2" fill="none" opacity=".9">
    <circle cx="960" cy="540" r="40"/>
    <line x1="960" y1="490" x2="960" y2="480"/><line x1="960" y1="590" x2="960" y2="600"/>
    <line x1="910" y1="540" x2="900" y2="540"/><line x1="1010" y1="540" x2="1020" y2="540"/>
  </g>
  <circle cx="960" cy="540" r="3" fill="#E6F1FF"/>

  <!-- Oleada -->
  <path d="M792 32 H1140 V100 L1128 112 H780 V44 Z" class="p"/>
  <text x="960" y="72" text-anchor="middle" class="f tx" font-size="30" font-weight="600" letter-spacing="2">OLEADA 12 / 50</text>
  <text x="960" y="98" text-anchor="middle" class="f ts lbl">7 ENEMIGOS RESTANTES</text>

  <!-- Transmisión -->
  <path d="M60 48 H568 V156 L556 168 H48 V60 Z" class="p"/>
  <text x="72" y="82" class="f ta lbl">◉ TRANSMISIÓN · MANDO DE LA RED</text>
  <text x="72" y="116" class="i tx" font-size="20">Atalaya, las estaciones del sector 4 no responden.</text>
  <text x="72" y="144" class="i tx" font-size="20">Mantenga la posición. Solo quedan ustedes.</text>

  <!-- Radar -->
  <text x="60" y="702" class="f ts lbl">RADAR</text>
  <circle cx="210" cy="870" r="150" fill="#0A1220" fill-opacity=".78" stroke="#2AD4FF" stroke-opacity=".35"/>
  <path d="M210 870 L124 747 A150 150 0 0 1 296 747 Z" fill="#2AD4FF" fill-opacity=".10"/>
  <circle cx="210" cy="870" r="50" fill="none" stroke="#2AD4FF" stroke-opacity=".2"/>
  <circle cx="210" cy="870" r="100" fill="none" stroke="#2AD4FF" stroke-opacity=".2"/>
  <text x="214" y="818" class="i ts" font-size="11">400</text>
  <text x="214" y="768" class="i ts" font-size="11">800</text>
  <g stroke="#2AD4FF" stroke-width="2"><line x1="205" y1="870" x2="215" y2="870"/><line x1="210" y1="865" x2="210" y2="875"/></g>
  <!-- en campo de visión -->
  <circle cx="244" cy="790" r="6" fill="#FF4D5E" stroke="#E6F1FF" stroke-width="1"/>
  <polygon points="176,794 181,802 171,802" fill="#FFD23F" stroke="#E6F1FF" stroke-width="1"/>
  <!-- fuera del campo de visión -->
  <g opacity=".7">
    <polygon points="330,890 338,898 330,906 322,898" fill="#B36BFF"/>
    <polygon points="341,900 347,900 344,905" fill="#E6F1FF"/>
    <circle cx="122" cy="952" r="4" fill="#FF4D5E"/>
    <polygon points="130,944 136,944 133,939" fill="#E6F1FF"/>
    <circle cx="96" cy="846" r="8" fill="#FF4D5E"/>
  </g>

  <!-- Estado de la estación -->
  <text x="1872" y="898" text-anchor="end" class="f ta lbl">NIVEL 3</text>
  <path d="M1452 912 H1872 V1020 L1860 1032 H1440 V924 Z" class="p"/>
  <text x="1464" y="946" class="f ts lbl">INTEGRIDAD</text>
  <text x="1848" y="946" text-anchor="end" class="f tx" font-size="20" font-weight="600">82 / 100</text>
  <rect x="1464" y="956" width="384" height="10" fill="#1A2638"/>
  <rect x="1464" y="956" width="315" height="10" fill="#3DDC84"/>
  <text x="1464" y="996" class="f ts lbl">ENERGÍA</text>
  <text x="1848" y="996" text-anchor="end" class="f tx" font-size="20" font-weight="600">60 / 100</text>
  <rect x="1464" y="1006" width="384" height="10" fill="#1A2638"/>
  <rect x="1464" y="1006" width="230" height="10" fill="#2AD4FF"/>
  <g stroke="#0A1220" stroke-width="2">
    <line x1="1502" y1="1006" x2="1502" y2="1016"/><line x1="1541" y1="1006" x2="1541" y2="1016"/><line x1="1579" y1="1006" x2="1579" y2="1016"/>
    <line x1="1618" y1="1006" x2="1618" y2="1016"/><line x1="1656" y1="1006" x2="1656" y2="1016"/><line x1="1694" y1="1006" x2="1694" y2="1016"/>
    <line x1="1733" y1="1006" x2="1733" y2="1016"/><line x1="1771" y1="1006" x2="1771" y2="1016"/><line x1="1810" y1="1006" x2="1810" y2="1016"/>
  </g>
</svg>
