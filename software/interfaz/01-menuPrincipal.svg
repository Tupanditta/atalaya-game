<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Atalaya · Menú principal</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#0D1A35"/><stop offset="1" stop-color="#02040A"/></radialGradient>
    <filter id="nebula" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="planet" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#16304F"/><stop offset="1" stop-color="#050B16"/></radialGradient>
  </defs>
  <style>
    .f{font-family:Rajdhani,'Segoe UI',sans-serif}
    .i{font-family:Inter,'Segoe UI',sans-serif}
    .tx{fill:#E6F1FF}.ts{fill:#8AA0B8}.ta{fill:#2AD4FF}
    .lbl{font-size:16px;letter-spacing:3px;font-weight:600}
    .key{fill:none;stroke:#8AA0B8;stroke-width:1}
  </style>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="1420" cy="300" rx="420" ry="260" fill="#6B3FD6" opacity=".28" filter="url(#nebula)"/>
  <ellipse cx="1700" cy="760" rx="380" ry="220" fill="#2AD4FF" opacity=".16" filter="url(#nebula)"/>
  <g fill="#E6F1FF">
    <circle cx="120" cy="90" r="1.2"/><circle cx="340" cy="210" r="0.9"/><circle cx="610" cy="120" r="1.5"/><circle cx="880" cy="60" r="1"/>
    <circle cx="1040" cy="240" r="1.3"/><circle cx="1260" cy="110" r="0.8"/><circle cx="1500" cy="70" r="1.4"/><circle cx="1780" cy="180" r="1"/>
    <circle cx="1860" cy="420" r="1.2"/><circle cx="1180" cy="460" r="0.9"/><circle cx="980" cy="640" r="1.1"/><circle cx="760" cy="880" r="1.4"/>
    <circle cx="420" cy="980" r="1"/><circle cx="230" cy="760" r="1.3"/><circle cx="80" cy="520" r="0.9"/><circle cx="1350" cy="980" r="1.2"/>
    <circle cx="1560" cy="560" r="0.8"/><circle cx="700" cy="380" r="1"/><circle cx="1100" cy="860" r="0.9"/><circle cx="1880" cy="980" r="1.1"/>
  </g>
  <circle cx="1660" cy="1300" r="720" fill="url(#planet)" stroke="#2AD4FF" stroke-opacity=".35" stroke-width="2"/>

  <text x="160" y="380" class="f tx" font-size="140" font-weight="700" letter-spacing="24" filter="url(#glow)">ATALAYA</text>
  <text x="166" y="430" class="f ta lbl" font-size="20">ÚLTIMA GUARDIA DE LA RED</text>

  <rect x="160" y="520" width="480" height="64" fill="#2AD4FF" fill-opacity=".14"/>
  <rect x="160" y="520" width="4" height="64" fill="#2AD4FF"/>
  <text x="188" y="563" class="f tx" font-size="32" font-weight="600" letter-spacing="3">JUGAR</text>
  <text x="612" y="563" class="f ta" font-size="32" font-weight="600">›</text>
  <text x="188" y="643" class="f ts" font-size="32" font-weight="600" letter-spacing="3">MANUAL</text>
  <text x="188" y="723" class="f ts" font-size="32" font-weight="600" letter-spacing="3">SALIR DEL JUEGO</text>

  <g class="i" font-size="16" font-weight="500">
    <rect x="770" y="1008" width="40" height="30" rx="4" class="key"/><text x="790" y="1029" text-anchor="middle" class="ts">↑↓</text>
    <text x="820" y="1029" class="ts">Navegar</text>
    <text x="900" y="1029" class="ts">·</text>
    <rect x="920" y="1008" width="56" height="30" rx="4" class="key"/><text x="948" y="1029" text-anchor="middle" class="ts">Intro</text>
    <text x="986" y="1029" class="ts">Confirmar</text>
  </g>
  <text x="1872" y="1032" text-anchor="end" class="i ts" font-size="14">v0.1</text>
</svg>
