<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Atalaya · Manual, sección de tipos de enemigo</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#0D1A35"/><stop offset="1" stop-color="#02040A"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .f{font-family:Rajdhani,'Segoe UI',sans-serif}
    .i{font-family:Inter,'Segoe UI',sans-serif}
    .p{fill:#0A1220;fill-opacity:.88;stroke:#2AD4FF;stroke-opacity:.35}
    .c{fill:#0F1A2C;stroke:#2AD4FF;stroke-opacity:.2}
    .tx{fill:#E6F1FF}.ts{fill:#8AA0B8}.ta{fill:#2AD4FF}
    .lbl{font-size:16px;letter-spacing:3px;font-weight:600}
    .tab{font-size:22px;font-weight:600;letter-spacing:3px}
    .key{fill:none;stroke:#8AA0B8;stroke-width:1}
  </style>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="#000" opacity=".45"/>
  <path d="M252 120 H1680 V948 L1668 960 H240 V132 Z" class="p"/>

  <!-- Pestañas -->
  <text x="288" y="192" class="f ts tab">CONTROLES</text>
  <text x="478" y="192" class="f ta tab">ENEMIGOS</text>
  <rect x="478" y="204" width="118" height="3" fill="#2AD4FF"/>
  <text x="656" y="192" class="f ts tab">TAMAÑOS</text>
  <text x="826" y="192" class="f ts tab">ENTORNOS</text>
  <text x="1008" y="192" class="f ts tab">MEJORAS</text>
  <text x="1632" y="192" text-anchor="end" class="f ts tab">2 / 5</text>
  <line x1="288" y1="230" x2="1632" y2="230" stroke="#2AD4FF" stroke-opacity=".25"/>

  <text x="288" y="288" class="f ts lbl">TIPOS DE ENEMIGO</text>

  <!-- Sin efecto especial -->
  <path d="M300 320 H704 V748 L692 760 H288 V332 Z" class="c"/>
  <circle cx="496" cy="410" r="22" fill="#FF4D5E" filter="url(#glow)"/>
  <text x="496" y="462" text-anchor="middle" class="i ts" font-size="14">Símbolo en el radar</text>
  <text x="496" y="520" text-anchor="middle" class="f tx" font-size="32" font-weight="700" letter-spacing="3">SIN EFECTO</text>
  <g class="i" font-size="20">
    <text x="320" y="584" class="ts">Daño</text><text x="672" y="584" text-anchor="end" class="tx">3</text>
    <text x="320" y="622" class="ts">Recarga</text><text x="672" y="622" text-anchor="end" class="tx">4 s</text>
    <text x="320" y="660" class="ts">Efecto</text><text x="672" y="660" text-anchor="end" class="tx">ninguno</text>
  </g>

  <!-- Desestabilizador -->
  <path d="M764 320 H1168 V748 L1156 760 H752 V332 Z" class="c"/>
  <polygon points="960,386 984,428 936,428" fill="#FFD23F" filter="url(#glow)"/>
  <text x="960" y="462" text-anchor="middle" class="i ts" font-size="14">Símbolo en el radar</text>
  <text x="960" y="520" text-anchor="middle" class="f tx" font-size="32" font-weight="700" letter-spacing="3">DESESTABILIZADOR</text>
  <g class="i" font-size="20">
    <text x="784" y="584" class="ts">Daño</text><text x="1136" y="584" text-anchor="end" class="tx">1</text>
    <text x="784" y="622" class="ts">Recarga</text><text x="1136" y="622" text-anchor="end" class="tx">3 s</text>
    <text x="784" y="660" class="ts">Efecto</text><text x="1136" y="660" text-anchor="end" class="tx">pantalla y mira</text>
    <text x="1136" y="688" text-anchor="end" class="tx">tiemblan 3 s</text>
  </g>

  <!-- Aturdidor -->
  <path d="M1228 320 H1632 V748 L1620 760 H1216 V332 Z" class="c"/>
  <polygon points="1424,386 1448,410 1424,434 1400,410" fill="#B36BFF" filter="url(#glow)"/>
  <text x="1424" y="462" text-anchor="middle" class="i ts" font-size="14">Símbolo en el radar</text>
  <text x="1424" y="520" text-anchor="middle" class="f tx" font-size="32" font-weight="700" letter-spacing="3">ATURDIDOR</text>
  <g class="i" font-size="20">
    <text x="1248" y="584" class="ts">Daño</text><text x="1600" y="584" text-anchor="end" class="tx">2</text>
    <text x="1248" y="622" class="ts">Recarga</text><text x="1600" y="622" text-anchor="end" class="tx">8 s</text>
    <text x="1248" y="660" class="ts">Efecto</text><text x="1600" y="660" text-anchor="end" class="tx">no puedes girar</text>
    <text x="1600" y="688" text-anchor="end" class="tx">ni disparar 1,5 s</text>
  </g>

  <text x="288" y="830" class="i ts" font-size="20">Todos los enemigos avisan con un destello y un sonido de carga 1 s antes de disparar.</text>
  <text x="288" y="862" class="i ts" font-size="20">Si los destruyes durante el aviso, no llegan a disparar.</text>

  <g class="i" font-size="16" font-weight="500">
    <rect x="806" y="1008" width="40" height="30" rx="4" class="key"/><text x="826" y="1029" text-anchor="middle" class="ts">←→</text>
    <text x="856" y="1029" class="ts">Sección</text>
    <text x="928" y="1029" class="ts">·</text>
    <rect x="948" y="1008" width="44" height="30" rx="4" class="key"/><text x="970" y="1029" text-anchor="middle" class="ts">Esc</text>
    <text x="1002" y="1029" class="ts">Volver</text>
  </g>
</svg>
